rx="16" fill="#10b981" fill-opacity=".16" stroke="#10b981" stroke-opacity=".4"/><text x="410" y="168" font-size="15.5" fill="#f4f4f5" font-weight="500" text-anchor="start" >Why was labor 33% on Thursday?</text><rect x="36" y="212" width="700" height="292" rx="16" fill="#16181d" stroke="#26272c" /><text x="60" y="248" font-size="15.5" fill="#f4f4f5" font-weight="700" text-anchor="start" >Thursday labor ran 33.0% against a 28.0% target.</text><circle cx="68" cy="279" r="4" fill="#34d399"/><text x="84" y="284" font-size="14.5" fill="#d4d4d8" font-weight="400" text-anchor="start" >Sales were $3,610, about 14% below your Thursday average.</text><circle cx="68" cy="311" r="4" fill="#34d399"/><text x="84" y="316" font-size="14.5" fill="#d4d4d8" font-weight="400" text-anchor="start" >Scheduled hours were unchanged, so labor held while sales dipped.</text><circle cx="68" cy="343" r="4" fill="#34d399"/><text x="84" y="348" font-size="14.5" fill="#d4d4d8" font-weight="400" text-anchor="start" >Overtime added 6.5 hours across two team members.</text><line x1="60" y1="386" x2="712" y2="386" stroke="#26272c"/><text x="60" y="416" font-size="12.5" fill="#8b8d96" font-weight="600" text-anchor="start" >Suggested next step</text><text x="60" y="442" font-size="14.5" fill="#d4d4d8" font-weight="400" text-anchor="start" >Trim two floor hours on the next slow Thursday to bring labor near 28%.</text><rect x="60" y="462" width="150" height="22" rx="11" fill="#34d399" fill-opacity=".14"/><text x="135.0" y="477" font-size="11.5" fill="#34d399" font-weight="600" text-anchor="middle" >Read-only data access</text><rect x="222" y="462" width="96" height="22" rx="11" fill="#34d399" fill-opacity=".14"/><text x="270.0" y="477" font-size="11.5" fill="#34d399" font-weight="600" text-anchor="middle" >Labor report</text><rect x="772" y="212" width="92" height="22" rx="11" fill="#8b8d96" fill-opacity=".14"/><text x="818.0" y="227" font-size="11.5" fill="#8b8d96" font-weight="600" text-anchor="middle" >Sample data</text><rect x="36" y="524" width="260" height="44" rx="12" fill="#16181d" stroke="#26272c" /><text x="166" y="551" font-size="12.5" fill="#d4d4d8" font-weight="500" text-anchor="middle" >Run the Morning Executive Briefing</text><rect x="320" y="524" width="260" height="44" rx="12" fill="#16181d" stroke="#26272c" /><text x="450" y="551" font-size="12.5" fill="#d4d4d8" font-weight="500" text-anchor="middle" >Summarize prime cost this week</text><rect x="604" y="524" width="260" height="44" rx="12" fill="#16181d" stroke="#26272c" /><text x="734" y="551" font-size="12.5" fill="#d4d4d8" font-weight="500" text-anchor="middle" >Any invoice price spikes?</text><rect x="36" y="584" width="828" height="38" rx="19" fill="#16181d" stroke="#26272c" /><text x="60" y="608" font-size="13.5" fill="#71717a" font-weight="400" text-anchor="start" >Ask about sales, labor, costs…</text><circle cx="840" cy="603" r="12" fill="#10b981"/><path d="M835 603h10m-4-4 4 4-4 4" stroke="#04120c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
