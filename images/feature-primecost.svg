<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 708" width="968" height="708" role="img" aria-label="Prime cost broken into food, paper and true labor against a 60 percent ceiling (sample data)" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Prime cost broken into food, paper and true labor against a 60 percent ceiling (sample data)</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#052e24" flood-opacity=".28"/></filter><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981" stop-opacity=".35"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient></defs>
<rect width="968" height="708" rx="30" fill="#064e3b"/><g transform="translate(34 34)"><g filter="url(#sh)"><rect x="0.5" y="0.5" width="899" height="639" rx="18" fill="#ffffff" stroke="#e5e7eb" /><text x="36" y="56" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" >True prime cost</text><text x="36" y="80" font-size="14" fill="#64748b" font-weight="400" text-anchor="start" >Food + paper + labor, as a percent of net sales</text><rect x="772" y="36" width="92" height="22" rx="11" fill="#64748b" fill-opacity=".14"/><text x="818.0" y="51" font-size="11.5" fill="#64748b" font-weight="600" text-anchor="middle" >Sample data</text><rect x="36.0" y="124" width="285.1" height="54" rx="6" fill="#10b981"/><text x="178.53428571428574" y="157" font-size="14" fill="#04120c" font-weight="700" text-anchor="middle" >Food 24.1%</text><rect x="324.1" y="124" width="49.7" height="54" rx="6" fill="#047857"/><text x="348.90857142857146" y="200" font-size="12" fill="#047857" font-weight="600" text-anchor="middle" >Paper 4.2%</text><rect x="376.7" y="124" width="324.1" height="54" rx="6" fill="#059669"/><text x="538.8000000000001" y="157" font-size="14" fill="#04120c" font-weight="700" text-anchor="middle" >Labor 27.4%</text><line x1="745.7" y1="110" x2="745.7" y2="192" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/><text x="745.7142857142858" y="102" font-size="12" fill="#b45309" font-weight="700" text-anchor="middle" >Ceiling 60%</text><text x="36" y="242" font-size="26" fill="#0f172a" font-weight="700" text-anchor="start" >Prime cost 55.7%</text><rect x="286" y="222" width="150" height="22" rx="11" fill="#047857" fill-opacity=".14"/><text x="361.0" y="237" font-size="11.5" fill="#047857" font-weight="600" text-anchor="middle" >4.3 pts under ceiling</text><rect x="36" y="276" width="828" height="336" rx="12" fill="#f6f8f7" stroke="#e5e7eb" /><text x="60" y="328" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start" >What “true labor” includes</text><text x="60" y="350" font-size="13" fill="#64748b" font-weight="400" text-anchor="start" >Standard POS reports stop at hourly wages. Restaurant360 AI adds the rest.</text><text x="60" y="392" font-size="14.5" fill="#334155" font-weight="500" text-anchor="start" >Hourly wages</text><text x="838" y="392" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="end" >19.6%</text><rect x="60" y="404" width="778" height="12" rx="6" fill="#e5e7eb"/><rect x="60" y="404" width="556.5" height="12" rx="6" fill="#10b981"/><text x="60" y="458" font-size="14.5" fill="#334155" font-weight="500" text-anchor="start" >Overtime premium</text><text x="838" y="458" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="end" >1.9%</text><rect x="60" y="470" width="778" height="12" rx="6" fill="#e5e7eb"/><rect x="60" y="470" width="53.9" height="12" rx="6" fill="#b45309"/><text x="60" y="524" font-size="14.5" fill="#334155" font-weight="500" text-anchor="start" >Salaried manager cost, amortized daily</text><text x="838" y="524" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="end" >5.9%</text><rect x="60" y="536" width="778" height="12" rx="6" fill="#e5e7eb"/><rect x="60" y="536" width="167.5" height="12" rx="6" fill="#059669"/><text x="60" y="590" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start" >Total true labor 27.4%  ·  Target ≤ 28.0%</text></g></g>
</svg>
