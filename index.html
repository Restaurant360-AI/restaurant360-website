<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant360 AI</title>
<meta name="description" content="Autonomous restaurant intelligence and operations copilot.">
<style>
  :root { --bg: #ffffff; --fg: #111827; --muted: #4b5563; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --fg: #f3f4f6; --muted: #9ca3af; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; text-align: center; }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; }
  p { color: var(--muted); font-size: 1.125rem; margin: 0; }
</style>
</head>
<body>
  <main>
    <h1>Restaurant360 AI</h1>
    <p>Autonomous restaurant intelligence and operations copilot.</p>
    <p style="margin-top:1.5rem">Coming soon.</p>
  </main>
</body>
</html>
